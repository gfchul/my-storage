company: "삼성에피스홀딩스"
ticker: "0126Z0"
as_of: "2026-07-25"

methods:
  - nav
  - normalized_per

rationale:
  nav: >
    순수 지주회사이며 핵심 자산이 사실상 삼성바이오에피스 지분 하나(+ 에피스넥스랩)로
    단순한 구조라, 자회사 지분가치 + 순현금을 합산하고 지주사 할인을 적용하는 NAV가
    표준적으로 맞는 방식. SOTP도 후보였으나, 세그먼트가 사업부문이 아니라 "지분"이라는
    점에서 NAV가 더 정확한 틀이라고 판단.
  normalized_per: >
    자회사(삼성바이오에피스) 실적이 지주사 연결실적에 반영되므로, 연결 기준 정상화
    순이익에 배수를 적용하는 방식도 NAV의 교차검증 수단으로 병행. 다만 지주사
    개별(별도) 실적과 혼동하지 않도록 "연결 기준"임을 명시해서 사용해야 함.

excluded_methods:
  dcf: >
    지주사 자체의 현금흐름은 사실상 자회사 배당 수취분이 전부라, 지주사 단위로 별도
    DCF를 돌리면 자회사 단위 가치평가(NAV에 이미 반영됨)와 이중계산될 위험이 있어 제외.
    (자회사 삼성바이오에피스 단위 DCF는 별도 논지로 다룰 수 있음 - 미착수)
  sotp: "핵심 사업 세그먼트가 사실상 단일(바이오시밀러)이라 SOTP로 쪼갤 실익이 적음"

notes: >
  재상장 첫날(2025-11-24) 시가총액이 순자산가치 기준 이론가 대비 약 1/3에 그쳤다는
  보도가 있음(theses/삼성에피스홀딩스.md) - 이는 시장이 이미 큰 폭의 지주사 할인을
  반영하고 있다는 뜻. holdco_discount 시나리오를 짤 때 이 사실을 참고할 것.
