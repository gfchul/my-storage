meta:
  currency: KRW

nav:
  stakes:
    삼성바이오에피스:
      value: null
      unit: KRW
      source: >
        확인 불가 - 서로 다른 3개 숫자가 검색됨, 사용자에게 먼저 충돌을 알림(규칙 3):
        (1) 3조 2,652억원 - "삼성에피스홀딩스가 가진 100% 자회사인 삼성바이오에피스의
        지분가치로 책정한 규모" (pharm.edaily, samsungbiologics 공식 보도자료 등 다수
        매체가 동일 문구로 반복 인용 - 분할 비율(65:35) 산정에 실제 쓰인 공식 평가액일
        가능성이 높아 3개 중 가장 신뢰도가 높다고 판단되나 확정은 아님).
        (2) 7조 2,410억원 - "삼성바이오에피스의 기업가치"(2025년 기준, 출처 불명확).
        (3) 4조 8,000억원 - "삼성바이오로직스가 보유한 지분의 공정가치"(분할 전 시점으로
        추정, 출처 불명확).
        세 숫자 모두 1차 공시(DART) 원문을 대조하지 못했고, "기업가치"인지 "지분가치"인지
        "공정가치 평가일"이 언제인지도 다 다르게 표현돼 있어 어느 것도 NAV 입력으로 쓰지
        않고 null로 둔다. DART에서 분할 관련 평가보고서(삼정회계법인 등) 원문 확인 필요.
    에피스넥스랩:
      value: null
      source: >
        확인 불가(자산가치) - 연구개발 단계 자회사로, 2026 1분기 약 10억원 순손실을
        기록했다는 정보는 확보(검색 결과). 다만 이는 손익 정보이지 지분가치가 아니라서
        NAV 입력으로 그대로 쓸 수 없음 - 자산가치 원문 필요.
    SVIC63호신기술사업투자조합:
      value: 36900000000
      unit: KRW
      source: >
        신규 발견 - 삼성에피스홀딩스가 SVIC 63호 신기술사업투자조합 지분 99%를 보유,
        2026 1분기 말 기준 자산 369억원 규모 (검색 결과). 삼성바이오에피스/에피스넥스랩과
        별개의 투자자산으로, 최초 조사 때는 존재 자체를 몰랐음. 금액이 작아 NAV 전체에
        미치는 영향은 제한적이나 완전성을 위해 별도 항목으로 추가.
  net_cash:
    value: null
    source: "확인 불가 - 지주사 개별 재무제표(현금성자산-차입금) 원문 미확인"
  shares_outstanding:
    value: 24368421
    source: >
      역산치 - 시가총액 9.26조원 / 주가 380,000원(2026-07-23) = 약 24,368,421주.
      두 숫자 모두 검색 결과 기반이며 1차 공시 대조 안 함. 참고용으로만 사용할 것.
  holdco_discount:
    bull: { value: null, source: "확인 불가 - 배당정책 확정 등으로 할인 축소 시나리오, 폭은 정성적 추정이라 미기입" }
    base:
      value: 0.67
      source: >
        역산 참고치 - 재상장 첫날 실제 시총(약 10조원대 초반)이 이론상 시총(약 30조원)
        대비 약 1/3이었다는 보도(theses/삼성에피스홀딩스.md, PRESS9)를 근거로 한
        "당시 시장이 반영한 할인율"의 근사치(1 - 1/3 = 0.67). 이는 미래 예측치가 아니라
        과거 한 시점의 시장 반응을 역산한 참고용 숫자이며, 현재도 같은 할인율이 유지된다는
        보장은 없음.
    bear: { value: null, source: "확인 불가" }

normalized_per:
  reported_net_income:
    value: null
    source: >
      확인 불가(연간 기준) - 지주사 연결 기준 2026 1분기 실적을 새로 확보: 매출
      4,538억9,400만원, 영업이익 905억4,800만원, 당기순이익 994억6,200만원(지배기업
      소유주지분 순이익도 동일) - 2025년 11월 출범 이후 첫 분기 흑자(디지털투데이).
      참고: 이 연결 매출(4,539억)이 자회사 삼성바이오에피스 단독 매출(4,549억)과
      비슷하지만 영업이익(905억)은 자회사 단독 영업이익(1,440억)보다 크게 낮다 -
      분할 관련 상각비, 지주사 자체 관리비 등 연결조정 때문으로 추정되나 확인 불가.
      어쨌든 이는 분기치라 연간 정상화 PER 계산에는 아직 못 씀 - 2~4분기 합산 필요.
