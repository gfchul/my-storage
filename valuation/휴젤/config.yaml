company: "휴젤"
ticker: "145020"
as_of: "2026-07-25"

methods:
  - normalized_per
  - dcf

rationale:
  normalized_per: >
    소송 관련 비용, 미국 직판 전환 초기 투자 등 전환기 비용이 최근 실적에 섞여 있어
    보고 순이익을 그대로 배수화하면 왜곡될 수 있다. 정상화 순이익 기준으로 톡신
    업계 peer(메디톡스 PER 33배, 대웅제약 PER 9~10배, 휴젤 자체 현재 PER 20배 -
    출처: 시사저널e)와 비교해 적정가치를 가늠하기 위해 선택.
  dcf: >
    미국 직판 전환으로 단기 마진은 훼손되지만 3분기 이후 중장기 FCF 프로파일이
    바뀌는 비즈니스라, 단일 시점 배수보다 다년도 현금흐름 추정이 이 구조 변화를
    더 잘 포착한다.

excluded_methods:
  nav: "지주회사가 아닌 단일 사업회사라 지분가치 합산(NAV) 방식이 맞지 않음"
  sotp: "톡신·필러 중심 단일 사업부문이라 SOTP로 쪼갤 만한 이질적 세그먼트가 없음"

notes: >
  최대주주(Aphrodite/CBC그룹)가 주당 40만원 이상에 매각을 타진 중이라는 보도가 있음
  (theses/휴젤.md 참고). 이는 별도의 "선례거래(precedent transaction)" 방식으로 다룰
  수 있는 신호이나, 이번 config에서는 2개 기법 한도에 맞춰 제외함 - 후속 확장 후보.
