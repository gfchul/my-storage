normalized_per:
  reported_net_income:
    value: null
    unit: KRW
    source: >
      확인 불가 - 2026년 1분기 순이익 406억원(theses/휴젤.md, 한국경제 2026-05-08)은
      확보했으나 이는 분기치. 정상화 PER은 연간(또는 TTM) 순이익 기준이 원칙인데,
      1개 분기 수치를 그대로 4배 해서 연환산하는 것은 계절성을 반영하지 못한 추정이므로
      "사실"로 쓰지 않고 null로 둔다. 연간(TTM) 순이익 원문 확인 후 채울 것.
