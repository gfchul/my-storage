# 값이 있는 항목은 반드시 source를 채운다. 모르면 value: null, source: "확인 불가"로 둘 것.
# 계산 모듈은 value가 null인 필수 입력이 있으면 계산을 거부하고 어떤 필드가 없는지 알려준다.

meta:
  currency: KRW
  reference_current_per:
    value: 20
    source: "시사저널e, 톡신업계 PER 비교 기사 - 휴젤 현재 PER 약 20배, 메디톡스 33배, 대웅제약 9~10배"

normalized_per:
  reported_net_income:
    value: 144000000000
    unit: KRW
    source: >
      확정 - 2025년 연결 기준 당기순이익 1,440억원(전년比 +0.6%). 매출 4,251억원(+14%),
      영업이익 2,016억원(+21.3%)과 함께 발표. [출처: 약사공론 2026, FETV, 히트뉴스
      "영업이익률 47%" 등 다수 매체 동일 수치 보도]. 참고: 영업이익 증가율(21.3%) 대비
      순이익 증가율(0.6%)이 크게 낮은 이유는 확인 불가 - 법인세, 금융비용, 소송 관련
      비용(메디톡스 ITC 소송 등) 중 무엇이 영향을 줬는지 원문 미확인.
  shares_outstanding:
    value: 12604000
    unit: "주"
    source: "검색 결과(씽크풀 등) - 발행주식 12,604천주. 1차 공시(DART) 원문 미대조, 다소 불확실"
  one_off_items: []
  # 정상화가 목적인데 one_off_items가 비어 있음: 위 순이익 증가율 이상 현상(주석 참고)의
  # 원인이 될 만한 일회성 항목을 특정하지 못했기 때문. 현재 값은 사실상 "보고 순이익"과
  # 동일 - 진짜 "정상화"는 아직 안 된 상태임을 명시.
  per_multiple:
    bull:
      value: 33
      source: >
        peer 밴드 상단을 시나리오 장치로 차용 - 메디톡스 현재 PER 33배(시사저널e).
        주의: 메디톡스의 33배는 메디톡스 자체의 성장 기대를 반영한 것이지 휴젤에
        적용 가능하다는 근거가 아님. 두 회사의 실적/리스크 프로필이 달라 직접 비교는
        단순화임을 감안할 것.
    base:
      value: 20
      source: "meta.reference_current_per와 동일 (시사저널e) - 현재 시장이 부여한 배수를 그대로 사용"
    bear:
      value: 9.5
      source: >
        peer 밴드 하단을 시나리오 장치로 차용 - 대웅제약 12개월 선행 PER 약 9~10배
        중간값(더퍼블릭, ftoday). 위 bull과 동일한 단순화 한계 있음.

dcf:
  fcf_base:
    value: null
    source: "확인 불가 - 잉여현금흐름(영업현금흐름-capex) 원문 미확인. 영업이익을 대용치로 쓰지 않음(세금·운전자본·capex 미반영 왜곡 우려)"
  discount_rate:
    value: null
    source: "확인 불가 - WACC 산정에 필요한 베타·부채비율·타인자본비용 원자료 없음"
  terminal_growth_rate:
    value: 0.02
    source: >
      정성적 모델링 관례(장기 명목GDP 성장률 근사) - 휴젤 고유의 전망치가 아니라
      DCF에서 흔히 쓰는 기본값. "사실"이 아니라 사용자가 조정 가능한 기본 설정임.
  years:
    value: 5
    source: "모델 설정값(전망 기간) - 소스 아님, 임의 선택"
  shares_outstanding:
    value: 12604000
    source: "normalized_per.shares_outstanding과 동일 출처"
  net_debt:
    value: null
    source: >
      확인 불가(정밀치) - 다만 정성적으로는 순현금 상태일 가능성이 높음: 부채비율이
      2021년 21.8% -> 2025년말 9.9% -> 2026 1Q 9.6%로 낮고(더바이오), 현금성자산은
      2026 1Q 기준 약 5,800억원(더바이오). 부채비율의 분모(총부채)에는 매입채무 등
      비이자성 부채도 섞여 있어 "총부채"를 그대로 "이자부 차입금"으로 쓸 수 없으므로
      순차입금을 정밀하게 역산하지 않음 - 재무제표 원문(차입금 항목) 필요.
  growth_rate:
    bull: { value: null, source: "확인 불가" }
    base: { value: null, source: "확인 불가" }
    bear: { value: null, source: "확인 불가" }
