company: "삼성에스디에스"
ticker: "018260"
as_of: "2026-07-25"

methods:
  - normalized_per
  - sotp

rationale:
  normalized_per: >
    2026년 1분기 영업이익이 퇴직급여 산정기준 변경에 따른 일회성 비용(1,120억원)
    반영으로 전년比 70.8% 급감(theses/삼성에스디에스.md). 보고 순이익을 그대로
    쓰면 이 일회성 효과가 왜곡을 일으키므로 정상화가 필요.
  sotp: >
    IT서비스, 클라우드, 물류BPO가 성장률·마진 프로필이 서로 다른 이질적 사업부문이라
    (클라우드는 1Q 매출 +5.8% YoY로 IT서비스 내 최대 비중 사업으로 성장 중인 반면
    ITO 등 레거시 사업은 성장 정체로 보임), 단일 연결 배수보다 부문별 배수 합산이
    고성장 사업부의 가치를 레거시 사업부에 가려지지 않게 드러낼 수 있음.

excluded_methods:
  dcf: >
    다부문 사업 구조 + 최근 일회성 비용으로 근시일 현금흐름 추정 자체가 불안정해
    현재로서는 SOTP가 더 투명한 대안이라고 판단. 사업부별 성장률 데이터가 쌓이면
    부문별 DCF로 확장 가능.
  nav: "지주회사가 아니고 유의미한 상호출자·지분투자 구조도 확인되지 않아 해당 없음"

notes: >
  이재용 회장의 상속세 재원 관련 지분 매각 오버행이 있음(theses 참고). 이는 밸류에이션
  기법이 아니라 지배구조 리스크이므로 config가 아니라 theses에서 다룸 - 여기서는
  숫자로 환산하지 않는다.
